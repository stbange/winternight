    <text x="64" y="92" fill="#9caac5" font-size="17">Visual direction / warmth, winter and a world that keeps the marks</text>
    <text x="1376" y="60" text-anchor="end" fill="#9caac5" font-size="14" letter-spacing="2">CONCEPT STUDIES 01–04</text>

