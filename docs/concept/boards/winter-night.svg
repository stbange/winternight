      <text x="20" y="312" fill="#e5e9f3" font-size="21" font-weight="700">01 / THE APPROACH</text>
      <text x="20" y="339" fill="#aab6cd" font-size="16">Black pines, blue snow, a small amber destination.</text>
      <text x="20" y="358" fill="#aab6cd" font-size="14">Immediate benchmark: silhouette, trail, fog and window light.</text>
    </g>

