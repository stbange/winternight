<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Winternight — four winter composition studies</title>
  <desc id="description">Schematic colour and framing studies, not engine screenshots. A moonlit road leads to warm castle windows; a feast glows under dark rafters; a pale bone dragon tears through the roof; blue snow covers the broken room and a dark red trail. Palette strips compare night snow, fire and bone.</desc>
