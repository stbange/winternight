# Publishes the web build (WebGL2, touch, WebXR) to GitHub Pages on every push to main.
name: Web build on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: Build
        run: |
          emcmake cmake -S . -B build/web -DCMAKE_BUILD_TYPE=Release -DWN_BUILD_TESTS=OFF
          cmake --build build/web
      - name: Assemble site
        run: |
          mkdir -p _site
          cp build/web/winternight.html build/web/winternight.js build/web/winternight.wasm build/web/winternight.data _site/
          cp build/web/winternight.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
