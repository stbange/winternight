# Publishes the web build (WebGL2, touch, WebXR) to GitHub Pages on every push
# to main by updating the gh-pages branch, which GitHub Pages serves.
name: Web build on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: Build
        run: |
          emcmake cmake -S . -B build/web -DCMAKE_BUILD_TYPE=Release -DWN_BUILD_TESTS=OFF
          cmake --build build/web
      - name: Update the gh-pages branch
        run: |
          mkdir _site
          cp build/web/winternight.html build/web/winternight.js build/web/winternight.wasm build/web/winternight.data _site/
          cp build/web/winternight.html _site/index.html
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of Winternight (main ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
