<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Winternight</title>
<style>
  :root { --bg: #05070f; --fg: #c9d6f2; --warm: #ffb050; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; touch-action: none; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated;
    outline: none; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 16px; letter-spacing: 0.08em; pointer-events: none; }
  #status.error { color: var(--warm); pointer-events: auto; }
  #vr { position: fixed; right: 16px; top: 16px; display: none; padding: 8px 14px; background: transparent;
    color: var(--warm); border: 2px solid var(--warm); font: inherit; letter-spacing: 0.1em; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">THE ROAD TO HEARTHHOLM&hellip;</div>
<button id="vr" type="button">ENTER VR</button>
<script>
  // spec platform-targets: Graceful start-up failure (No WebGL2).
  (function () {
    var ok = false;
    try { ok = !!document.createElement('canvas').getContext('webgl2'); } catch (e) { ok = false; }
    if (!ok) {
      var s = document.getElementById('status');
      s.textContent = 'Winternight needs WebGL2. Please use a current version of Chrome, Edge, Firefox or Safari.';
      s.className = 'error';
      window.WN_NO_WEBGL2 = true;
    }
  })();
  // ?test=<script> runs an automated game test in the browser (no golden images).
  var WN_ARGS = (function () {
    var q = new URLSearchParams(location.search), a = [];
    if (q.get('test')) a.push('--test', '/tests/' + q.get('test'), '--golden', '', '--out', '/tmp');
    if (q.get('preset')) a.push('--preset', q.get('preset'));
    if (q.has('stats')) a.push('--stats');
    return a;
  })();
  var Module = {
    arguments: WN_ARGS,
    canvas: document.getElementById('canvas'),
    print: function (t) {
      console.log(t);
      if (/^GAME TEST (PASSED|FAILED)/.test(t)) window.WN_TEST_RESULT = t;
    },
    printErr: function (t) {
      console.warn(t);
      if (/^GAME TEST FAILED/.test(t)) window.WN_TEST_RESULT = t;
      if (window.WN_TEST_RESULT && /FAILED/.test(window.WN_TEST_RESULT) && !/^GAME TEST/.test(t)) window.WN_TEST_RESULT += '\n' + t;
    },
    onWinternightReady: function () {
      document.getElementById('status').style.display = 'none';
      window.WN_READY = true;
    },
    onAbort: function (what) {
      var s = document.getElementById('status');
      s.style.display = 'flex';
      s.className = 'error';
      s.textContent = 'Winternight could not start: ' + what;
    }
  };
  window.wnStatus = function () { return JSON.parse(Module.ccall('wn_web_status', 'string', [], [])); };
  document.getElementById('vr').addEventListener('click', function () { if (window.wnEnterVR) window.wnEnterVR(); });
  if (window.WN_NO_WEBGL2) { Module.noInitialRun = true; }
</script>
{{{ SCRIPT }}}
</body>
</html>
